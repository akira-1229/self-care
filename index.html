<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="セルフケア">
  <meta name="theme-color" content="#0b1220">
  <meta name="app-build" content="202611272010-v7">
  <title>セルフケア</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/heart.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/heart-180.png">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="title-card" id="titleCard" aria-label="タップで今すぐ更新">
        <h1 id="appName">セルフケア</h1>
        <p id="syncStatus" class="sub">読み込み中…</p>
      </button>
    </header>

    <div id="demoBanner" class="banner" hidden>
      デモデータを表示中です。<button id="btnOpenSettings2" class="link">設定</button>タブからスプレッドシートを連携してください。
    </div>
    <div id="errorBanner" class="banner error" hidden></div>
    <button id="updateBanner" class="update-banner" hidden>✨ 新しいバージョンがあります　<b>タップで更新</b></button>

    <div id="viewer" aria-label="人型の3Dモデル（ドラッグで回転・部位をタップで記録）"></div>
    <p class="hint" id="hint">ドラッグで回転 ・ 髪／顔／身体をタップで記録</p>
    <div id="toast" class="toast" role="status"></div>

    <section id="panel" class="panel" aria-hidden="true">
      <div class="grabber"></div>
      <div class="panel-head">
        <div>
          <h2 id="panelTitle"></h2>
          <p id="panelSub" class="sub"></p>
        </div>
        <div class="head-btns">
          <button id="btnAdd" class="icon-btn add-btn" aria-label="記録を追加" hidden>
            <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          </button>
          <button id="btnClosePanel" class="icon-btn" aria-label="閉じる">
            <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
          </button>
        </div>
      </div>
      <div id="panelBody" class="panel-body"></div>
    </section>
    <nav class="tabbar" id="tabbar">
      <button class="tab" data-tab="summary">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 21.35 10.55 20.03C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54z"/></svg>
        <span>概要</span>
      </button>
      <button class="tab" data-tab="all">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M19 3h-4.18A3 3 0 0 0 12 1a3 3 0 0 0-2.82 2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm-7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm2 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
        <span>記録</span>
      </button>
      <button class="tab" data-tab="body">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a2 2 0 1 1 0 4 2 2 0 0 1 0-4zm9 7h-6v13h-2v-6h-2v6H9V9H3V7h18v2z"/></svg>
        <span>身体</span>
      </button>
      <button class="tab" data-tab="settings">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M19.14 12.94a7.07 7.07 0 0 0 0-1.88l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.03 7.03 0 0 0-1.63-.94l-.36-2.54A.5.5 0 0 0 13.9 2h-3.84a.5.5 0 0 0-.49.42l-.36 2.54c-.59.24-1.13.56-1.63.94l-2.39-.96a.5.5 0 0 0-.61.22L2.66 8.48a.5.5 0 0 0 .12.64l2.03 1.58a7.07 7.07 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.3.61.22l2.39-.96c.5.38 1.04.7 1.63.94l.36 2.54c.04.24.25.42.49.42h3.84c.24 0 .45-.18.49-.42l.36-2.54c.59-.24 1.13-.56 1.63-.94l2.39.96c.22.08.48 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>
        <span>設定</span>
      </button>
    </nav>
    <div id="docViewer" class="doc-viewer" hidden>
      <button class="icon-btn doc-close" id="docClose" aria-label="閉じる">✕</button>
      <img id="docImg" alt="" referrerpolicy="no-referrer">
      <a id="docLink" class="doc-link" target="_blank" rel="noopener">元の画像を開く</a>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
